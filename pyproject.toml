[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gps_analysis"]

[tool.marimo.runtime]
output_max_bytes = 60_000_000

[project]
name = "gps-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.19.6",
    "pandas",
    "numpy",
    "geopandas",
    "lonboard",
    "shapely",
    "openpyxl",
    "pyarrow>=23.0.1",
    "matplotlib",
    "scipy",
    "zstandard>=0.25.0",
    "pylatex>=1.4.2",
    "filterpy>=1.4.5",
]
